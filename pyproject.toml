[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyleaf-torch"
version = "0.1.0"
description = "Differentiable PyTorch implementation of the pyLeaf C4 leaf model"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "pyLeaf contributors"}]
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
io = [
  "numpy>=1.26",
  "pandas>=2.1",
  "openpyxl>=3.1",
]
plot = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
]
benchmark = [
  "scipy>=1.12",
]
test = [
  "pytest>=8",
  "numpy>=1.26",
  "pandas>=2.1",
  "openpyxl>=3.1",
]
all = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pytest>=8",
  "scipy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
